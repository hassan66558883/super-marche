# TECHNOVA POS — production stack: PostgreSQL, API, web (Nginx + TLS), nightly backups.
#   cp .env.example .env   # then fill in every CHANGE_ME value
#   docker compose up -d --build
#   docker compose run --rm api node dist/cli/bootstrap.js   # first administrator (once)
name: technova

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technova}
      POSTGRES_USER: ${POSTGRES_USER:-technova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Africa/Ndjamena}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}" }
    image: technova-api:${TECHNOVA_VERSION:-latest}
    init: true
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-technova}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-technova}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TTL_HOURS: ${REFRESH_TTL_HOURS:-12}
      REFRESH_TTL_REMEMBER_DAYS: ${REFRESH_TTL_REMEMBER_DAYS:-30}
      CORS_ORIGINS: https://${SERVER_NAME:-localhost}
      TRUST_PROXY: 1
      COOKIE_SECURE: "true"
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      TZ: ${TZ:-Africa/Ndjamena}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_COMPANY_NAME: ${BOOTSTRAP_COMPANY_NAME:-TECHNOVA POS}
      BOOTSTRAP_BRANCH_CODE: ${BOOTSTRAP_BRANCH_CODE:-NDJ}
      BOOTSTRAP_BRANCH_NAME: ${BOOTSTRAP_BRANCH_NAME:-Siège}
      BOOTSTRAP_BRANCH_CITY: ${BOOTSTRAP_BRANCH_CITY:-N'Djamena}
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}", SELF_SIGNED: "${SELF_SIGNED_CERT:-1}" }
    image: technova-web:${TECHNOVA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      API_UPSTREAM: api:4000
      TZ: ${TZ:-Africa/Ndjamena}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Put fullchain.pem and privkey.pem here (Let's Encrypt or your own CA).
      # Without them a temporary self-signed certificate is generated.
      - ${CERTS_DIR:-./nginx/certs}:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [frontend]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-technova}
      PGUSER: ${POSTGRES_USER:-technova}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Africa/Ndjamena}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
    internal: true
  frontend:
