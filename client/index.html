<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123a8c" />
    <meta name="description" content="TECHNOVA POS — Smart Sales. Smart Stock. Smart Business." />
    <title>TECHNOVA POS</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash
      try {
        var t = JSON.parse(localStorage.getItem('technova-ui') || '{}').state?.theme || 'light';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
